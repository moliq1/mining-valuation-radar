name: Free EOD research sync (AKShare / efinance)

on:
  schedule:
    # Workdays at 20:05 Asia/Shanghai; GitHub Actions can be delayed.
    - cron: '5 12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate free providers without publishing (recommended)'
        type: boolean
        default: true
        required: true

permissions:
  contents: write
concurrency:
  group: market-eod-sync
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARKET_DATA_PUBLICATION_AUTHORIZED: ${{ vars.MARKET_DATA_PUBLICATION_AUTHORIZED }}
      FREE_DATA_REDISPLAY_RIGHTS_VERIFIED: ${{ vars.FREE_DATA_REDISPLAY_RIGHTS_VERIFIED }}
      FREE_MARKET_SYNC_ENABLED: ${{ vars.FREE_MARKET_SYNC_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check publication gates
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "Read-only dry-run: source prices will not be pushed to Pages. An optional 2-day workflow artifact will be downloadable by users with repository Actions access; on public repositories do NOT regard this as confidential storage." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$MARKET_DATA_PUBLICATION_AUTHORIZED" == "true" && "$FREE_DATA_REDISPLAY_RIGHTS_VERIFIED" == "true" && "$FREE_MARKET_SYNC_ENABLED" == "true" ]]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Free data sync not publicly enabled. Free scraping access does NOT confer redistribution rights." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.mode != 'skip'
        with:
          python-version: '3.11'
      - name: Install EOD collectors
        if: steps.gate.outputs.mode != 'skip'
        run: |
          python -m pip install --upgrade pip
          pip install "akshare>=1.16,<3" "efinance>=0.5,<1" "pandas>=2,<3" "baostock>=0.8,<1" "yfinance>=0.2,<1"
      - name: Verify Python parsers without network
        if: steps.gate.outputs.mode != 'skip'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch daily EOD (AKShare -> efinance)
        if: steps.gate.outputs.mode != 'skip'
        run: |
          if [[ "${{ steps.gate.outputs.mode }}" == "publish" ]]; then
            python scripts/free_market_sync.py --publish
          else
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              python scripts/free_market_sync.py --output-dir "$RUNNER_TEMP/ore-research-data"
            else
              python scripts/free_market_sync.py
            fi
          fi
      - name: Summarize read-only price coverage
        if: github.event_name == 'workflow_dispatch' && steps.gate.outputs.mode == 'dry-run'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ore-research-data/data-quality-report.json" ]]; then
            python - "$RUNNER_TEMP/ore-research-data/data-quality-report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          info=json.load(open(sys.argv[1],encoding='utf-8'))
          updated=info.get('updated',[])
          failures=info.get('fetchFailures',[])+info.get('failed',[])
          print("### EOD dry-run results")
          print(f"- A/H securities refreshed: **{len(updated)}/12**")
          print(f"- Shanghai Au99.99 received: **{'yes' if info.get('goldUpdated') else 'no'}**")
          print("- Download `market-history.csv` from the artifact below and upload it in the ORE Radar History view.")
          if failures:
            print("- Provider warnings and missing tickers:")
            for item in failures[:15]: print("  - "+str(item).split(":",1)[0])
          print("- The artifact is not published to Pages, but is **not confidential on a public repository**.")
          PY
          fi
      - name: Upload optional dry-run research download
        if: github.event_name == 'workflow_dispatch' && steps.gate.outputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: ore-eod-research-${{ github.run_id }}
          path: ${{ runner.temp }}/ore-research-data/
          retention-days: 2
          if-no-files-found: warn
      - name: Revalidate JS charts and valuation rules
        if: steps.gate.outputs.mode == 'publish'
        run: |
          node --version
          npm run check
          npm test
      - name: Commit legally authorized market data
        if: steps.gate.outputs.mode == 'publish'
        shell: bash
        run: |
          if git diff --quiet -- data/snapshot.json data/market-history.json; then
            echo "No validated market updates." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/market-history.json
          git commit -m "data: update rights-cleared free EOD quotes"
          git pull --rebase
          git push
